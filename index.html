<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프린터 시리얼 관리</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 16px; color: #333; }
        *, *::before, *::after { box-sizing: border-box; }
        #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: -16px; background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); }
        .login-box { background: #fff; border-radius: 20px; padding: 36px 28px; width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
        .login-logo { text-align: center; font-size: 40px; margin-bottom: 8px; }
        .login-title { text-align: center; font-size: 18px; font-weight: 700; color: #1a73e8; margin-bottom: 4px; }
        .login-sub { text-align: center; font-size: 13px; color: #9aa0a6; margin-bottom: 28px; }
        .login-label { font-size: 13px; font-weight: 600; color: #5f6368; margin-bottom: 6px; display: block; }
        .login-input { width: 100%; padding: 13px 14px; border: 1.5px solid #dadce0; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 14px; }
        .login-input:focus { border-color: #1a73e8; }
        .login-btn { width: 100%; padding: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .login-err { color: #c5221f; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
        #appScreen { display: none; }
        .container { max-width: 540px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { margin: 0; color: #1a73e8; font-size: 20px; }
        .logout-btn { background: none; border: 1px solid #dadce0; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: #5f6368; cursor: pointer; }
        .info-box { background-color: #e8f0fe; padding: 12px; border-radius: 10px; font-size: 15px; text-align: center; margin-bottom: 20px; font-weight: 600; color: #1967d2; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"], textarea { flex: 1; padding: 14px; border: 1px solid #dadce0; border-radius: 10px; font-size: 16px; outline: none; }
        textarea { width: 100%; height: 100px; resize: none; font-family: monospace; font-size: 14px; }
        .btn { padding: 14px 20px; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary { background-color: #1a73e8; }
        .btn-scan { background-color: #ff6d00; width: 100%; margin-bottom: 16px; padding: 15px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-scan.active { background-color: #c62828; }
        .btn-success { background-color: #34a853; width: 100%; margin-top: 8px; padding: 12px; }
        .btn-outline { background-color: #ffffff; color: #5f6368; border: 1px solid #dadce0; padding: 10px; width: 100%; margin-top: 6px; }
        .bulk-section { background: #f8f9fa; border: 1px dashed #dadce0; padding: 14px; border-radius: 10px; margin-bottom: 20px; }
        .bulk-title { font-size: 14px; font-weight: bold; color: #5f6368; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .list-header { margin-top: 24px; border-bottom: 2px solid #f1f3f4; padding-bottom: 8px; }
        h3 { margin: 0; font-size: 16px; color: #5f6368; }
        ul { list-style: none; padding: 0; margin: 8px 0 0 0; max-height: 280px; overflow-y: auto; border: 1px solid #f1f3f4; border-radius: 10px; }
        li { padding: 12px 14px; border-bottom: 1px solid #f1f3f4; font-size: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .serial-text { font-family: monospace; font-size: 16px; font-weight: 600; color: #202124; flex: 1; }
        .used .serial-text { text-decoration: line-through; color: #9aa0a6; }
        .action-btns { display: flex; gap: 6px; }
        .check-btn { background-color: #f1f3f4; color: #5f6368; border: 1px solid #dadce0; padding: 6px 10px; font-size: 13px; border-radius: 6px; cursor: pointer; }
        .used .check-btn { background-color: #e6f4ea; color: #137333; border-color: #ceead6; }
        .delete-btn { background: none; color: #ea4335; border: none; padding: 6px 8px; font-size: 13px; cursor: pointer; }
        .msg { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; text-align: center; }
        .success { background-color: #e6f4ea; color: #137333; display: block; }
        .error { background-color: #fce8e6; color: #c5221f; display: block; }
        #scannerSection { display: none; margin-bottom: 16px; border-radius: 12px; overflow: hidden; background: #000; position: relative; }
        #scannerSection.show { display: block; }
        #video { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
        #scanOverlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .scan-frame { width: 80%; aspect-ratio: 3/1; position: relative; border-radius: 8px; }
        .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #ff6d00 40%, #ff6d00 60%, transparent); animation: scanmove 1.8s ease-in-out infinite; }
        @keyframes scanmove { 0% { top: 6%; opacity:0.5; } 50% { top:88%; opacity:1; } 100% { top:6%; opacity:0.5; } }
        .corner { position: absolute; width: 20px; height: 20px; }
        .tl { top:-2px; left:-2px; border-top:3px solid #ff6d00; border-left:3px solid #ff6d00; border-radius:4px 0 0 0; }
        .tr { top:-2px; right:-2px; border-top:3px solid #ff6d00; border-right:3px solid #ff6d00; border-radius:0 4px 0 0; }
        .bl { bottom:-2px; left:-2px; border-bottom:3px solid #ff6d00; border-left:3px solid #ff6d00; border-radius:0 0 0 4px; }
        .br { bottom:-2px; right:-2px; border-bottom:3px solid #ff6d00; border-right:3px solid #ff6d00; border-radius:0 0 4px 0; }
        #scanStatus { position: absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); color:#fff; font-size:13px; text-align:center; padding:8px; }
        #scanStatus.ok { color:#69f0ae; }
        #canvas { display:none; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo">📱</div>
        <div class="login-title">프린터 시리얼 관리</div>
        <div class="login-sub">로그인 후 이용하실 수 있습니다</div>
        <label class="login-label">아이디</label>
        <input class="login-input" type="text" id="loginId" placeholder="아이디 입력">
        <label class="login-label">비밀번호</label>
        <input class="login-input" type="password" id="loginPw" placeholder="비밀번호 입력">
        <button class="login-btn" id="loginBtn">로그인</button>
        <div class="login-err" id="loginErr">❌ 아이디 또는 비밀번호가 틀렸습니다.</div>
    </div>
</div>

<div id="appScreen">
<div class="container">
    <div class="top-bar">
        <h2>📱 프린터 시리얼 관리</h2>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
    <div class="info-box" id="totalCount">등록된 프린터: 0대</div>

    <button class="btn btn-scan" id="scanBtn">
        <span id="scanBtnIcon">📷</span>
        <span id="scanBtnText">카메라로 바코드 스캔</span>
    </button>

    <div id="scannerSection">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="scanOverlay">
            <div class="scan-frame">
                <div class="scan-line"></div>
                <div class="corner tl"></div><div class="corner tr"></div>
                <div class="corner bl"></div><div class="corner br"></div>
            </div>
        </div>
        <div id="scanStatus">바코드를 프레임 안에 맞춰 주세요</div>
    </div>

    <div class="input-group">
        <input type="text" id="serialInput" placeholder="시리얼 번호 직접 입력">
        <button class="btn btn-primary" id="regBtn">등록</button>
    </div>

    <div class="bulk-section">
        <div class="bulk-title">
            <span>📋 엑셀 목록 대량 업로드</span>
            <span style="font-weight:normal; font-size:12px; color:#9aa0a6;">엔터나 콤마(,)로 구분</span>
        </div>
        <textarea id="bulkInput" placeholder="엑셀에서 복사한 시리얼 번호들을 여기에 붙여넣으세요."></textarea>
        <button class="btn btn-outline" id="bulkRegBtn" style="font-size:14px; font-weight:bold;">한 번에 모두 등록하기</button>
    </div>

    <div id="messageBox" class="msg"></div>
    <div class="list-header"><h3>📋 등록된 시리얼 목록</h3></div>
    <ul id="serialList"></ul>
    <button class="btn btn-success" id="backupBtn">📊 엑셀(CSV) 파일로 백업받기</button>
</div>
</div>

<!-- ZXing: 검증된 버전 -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.1/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js"></script>
<script>
    /* ── 로그인 ── */
    const USERS = { 'seeeye': '5864' };
    function checkSession() { if (sessionStorage.getItem('login') === 'ok') showApp(); }
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('loginPw').addEventListener('keypress', e => { if (e.key==='Enter') doLogin(); });
    document.getElementById('loginId').addEventListener('keypress', e => { if (e.key==='Enter') document.getElementById('loginPw').focus(); });

    function doLogin() {
        const id = document.getElementById('loginId').value.trim();
        const pw = document.getElementById('loginPw').value;
        if (USERS[id] && USERS[id] === pw) {
            sessionStorage.setItem('login', 'ok'); showApp();
        } else {
            const err = document.getElementById('loginErr');
            err.style.display = 'block';
            document.getElementById('loginPw').value = '';
            setTimeout(() => { err.style.display = 'none'; }, 3000);
        }
    }
    function showApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        updateUI();
    }
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            stopScan();
            sessionStorage.removeItem('login');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('loginId').value = '';
            document.getElementById('loginPw').value = '';
        }
    }

    /* ── 스캔 ── */
    let scanning = false, codeReader = null;
    let lastVal = '', lastTs = 0;

    document.getElementById('scanBtn').addEventListener('click', () => scanning ? stopScan() : startScan());

    async function startScan() {
        setScanStatus('카메라 시작 중...', false);
        try {
            // @zxing/browser 방식 (최신)
            const ZXingBr = window.ZXingBrowser;
            const ZXingLib = window.ZXing;

            let reader;
            if (ZXingBr && ZXingBr.BrowserMultiFormatReader) {
                reader = new ZXingBr.BrowserMultiFormatReader();
            } else if (ZXingLib && ZXingLib.BrowserMultiFormatReader) {
                reader = new ZXingLib.BrowserMultiFormatReader();
            } else {
                showMsg('❌ 라이브러리 로딩 실패. 페이지를 새로고침 해주세요.', 'error');
                return;
            }

            codeReader = reader;
            const video = document.getElementById('video');

            // 후면 카메라 찾기
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cams = devices.filter(d => d.kind === 'videoinput');
            const back = cams.find(d => /back|rear|environment/i.test(d.label)) || cams[cams.length - 1];

            if (ZXingBr && ZXingBr.BrowserMultiFormatReader) {
                const controls = await reader.decodeFromVideoDevice(back?.deviceId, video, (result, err) => {
                    if (result) onDetected(result.getText());
                });
            } else {
                await reader.decodeFromVideoDevice(back?.deviceId, video, (result, err) => {
                    if (result) onDetected(result.getText());
                });
            }

            document.getElementById('scannerSection').classList.add('show');
            scanning = true;
            document.getElementById('scanBtn').classList.add('active');
            document.getElementById('scanBtnIcon').textContent = '⏹';
            document.getElementById('scanBtnText').textContent = '스캔 중단';
            setScanStatus('바코드를 프레임 안에 맞춰 주세요', false);

        } catch(e) {
            const msg = e.name === 'NotAllowedError'
                ? '❌ 카메라 권한이 거부됐습니다.'
                : '❌ 오류: ' + (e.message || e);
            showMsg(msg, 'error');
            setScanStatus('오류 발생', false);
        }
    }

    function onDetected(raw) {
        const now = Date.now();
        const val = raw.trim().toUpperCase().replace(/^\*|\*$/g, '');
        if (!val || (val === lastVal && now - lastTs < 2500)) return;
        lastVal = val; lastTs = now;
        document.getElementById('serialInput').value = val;
        setScanStatus('✅ 스캔 완료: ' + val, true);
        if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
        checkAndSave(true);
        setTimeout(() => { if (scanning) setScanStatus('바코드를 프레임 안에 맞춰 주세요', false); }, 2000);
    }

    function stopScan() {
        try { codeReader?.reset(); } catch(e) {}
        codeReader = null;
        const vid = document.getElementById('video');
        try { if (vid.srcObject) { vid.srcObject.getTracks().forEach(t => t.stop()); vid.srcObject = null; } } catch(e) {}
        scanning = false;
        document.getElementById('scannerSection').classList.remove('show');
        document.getElementById('scanBtn').classList.remove('active');
        document.getElementById('scanBtnIcon').textContent = '📷';
        document.getElementById('scanBtnText').textContent = '카메라로 바코드 스캔';
        setScanStatus('바코드를 프레임 안에 맞춰 주세요', false);
    }

    function setScanStatus(msg, ok) {
        const el = document.getElementById('scanStatus');
        el.textContent = msg; el.className = ok ? 'ok' : '';
    }

    /* ── 데이터 ── */
    let serialList = [];
    try { const d = localStorage.getItem("printer_serials_v2"); if (d) serialList = JSON.parse(d); } catch(e) {}

    function updateUI() {
        const listEl = document.getElementById("serialList");
        const usedCount = serialList.filter(i => i.used).length;
        document.getElementById("totalCount").innerText = `등록된 프린터: ${serialList.length}대 (사용 완료: ${usedCount}대)`;
        listEl.innerHTML = "";
        if (serialList.length === 0) {
            listEl.innerHTML = `<li style="justify-content:center; color:#9aa0a6; font-size:14px;">등록된 데이터가 없습니다.</li>`;
            return;
        }
        [...serialList].reverse().forEach(item => {
            const idx = serialList.indexOf(item);
            const li = document.createElement("li");
            if (item.used) li.className = "used";
            li.innerHTML = `<span class="serial-text">${item.serial}</span>
                <div class="action-btns">
                    <button class="check-btn" onclick="toggleUsed(${idx})">${item.used ? '✓ 완료' : '사용하기'}</button>
                    <button class="delete-btn" onclick="deleteSerial(${idx})">지우기</button>
                </div>`;
            listEl.appendChild(li);
        });
    }

    function checkAndSave(auto = false) {
        const input = document.getElementById("serialInput");
        const val = input.value.trim().toUpperCase();
        if (!val) { if (!auto) showMsg("⚠️ 시리얼 번호를 입력해 주세요.", "error"); return; }
        if (serialList.some(i => i.serial === val)) {
            showMsg(`❌ [중복] 이미 등록된 번호입니다! (${val})`, "error");
        } else {
            serialList.push({ serial: val, used: false });
            save(); showMsg(`✅ [완료] '${val}' 등록되었습니다.`, "success");
            input.value = ""; updateUI();
        }
    }

    function bulkSave() {
        const text = document.getElementById("bulkInput").value;
        if (!text.trim()) { showMsg("⚠️ 붙여넣은 내용이 없습니다.", "error"); return; }
        let added = 0, dup = 0;
        text.split(/[\n,;\t]+/).forEach(line => {
            const s = line.trim().toUpperCase();
            if (s) { if (!serialList.some(i => i.serial === s)) { serialList.push({ serial: s, used: false }); added++; } else dup++; }
        });
        save(); updateUI(); document.getElementById("bulkInput").value = "";
        showMsg(`📊 신규: ${added}건 / 중복 제외: ${dup}건`, "success");
    }

    function save() { try { localStorage.setItem("printer_serials_v2", JSON.stringify(serialList)); } catch(e) {} }
    function toggleUsed(i) { serialList[i].used = !serialList[i].used; save(); updateUI(); }
    function deleteSerial(i) { if (confirm("삭제하시겠습니까?")) { serialList.splice(i, 1); save(); updateUI(); } }

    function showMsg(text, type) {
        const el = document.getElementById("messageBox");
        el.innerText = text; el.className = `msg ${type}`;
        setTimeout(() => { if (el.innerText === text) el.style.display = 'none'; }, 4000);
    }

    function downloadCSV() {
        if (!serialList.length) { alert("백업할 데이터가 없습니다."); return; }
        let csv = "\uFEFF순번,프린터 시리얼 번호,사용 여부\n";
        serialList.forEach((item, i) => { csv += `${i+1},${item.serial},${item.used ? "사용 완료" : "미사용"}\n`; });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = "printer_backup.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    document.getElementById("regBtn").addEventListener("click", () => checkAndSave(false));
    document.getElementById("bulkRegBtn").addEventListener("click", bulkSave);
    document.getElementById("backupBtn").addEventListener("click", downloadCSV);
    document.getElementById("serialInput").addEventListener("keypress", e => { if (e.key === "Enter") checkAndSave(false); });

    checkSession();
</script>
</body>
</html>
