<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프린터 시리얼 관리 시스템</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 16px; color: #333; }
        *, *::before, *::after { box-sizing: border-box; }
        .container { max-width: 540px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #1a73e8; font-size: 22px; }
        .info-box { background-color: #e8f0fe; padding: 12px; border-radius: 10px; font-size: 15px; text-align: center; margin-bottom: 20px; font-weight: 600; color: #1967d2; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"], textarea { flex: 1; padding: 14px; border: 1px solid #dadce0; border-radius: 10px; font-size: 16px; outline: none; }
        textarea { width: 100%; height: 100px; resize: none; font-family: monospace; font-size: 14px; }
        .btn { padding: 14px 20px; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary { background-color: #1a73e8; }
        .btn-scan { background-color: #ff6d00; width: 100%; margin-bottom: 16px; padding: 15px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-scan.active { background-color: #c62828; }
        .btn-success { background-color: #34a853; width: 100%; margin-top: 8px; padding: 12px; }
        .btn-outline { background-color: #ffffff; color: #5f6368; border: 1px solid #dadce0; padding: 10px; width: 100%; margin-top: 6px; }
        .bulk-section { background: #f8f9fa; border: 1px dashed #dadce0; padding: 14px; border-radius: 10px; margin-bottom: 20px; }
        .bulk-title { font-size: 14px; font-weight: bold; color: #5f6368; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .list-header { margin-top: 24px; border-bottom: 2px solid #f1f3f4; padding-bottom: 8px; }
        h3 { margin: 0; font-size: 16px; color: #5f6368; }
        ul { list-style: none; padding: 0; margin: 8px 0 0 0; max-height: 280px; overflow-y: auto; border: 1px solid #f1f3f4; border-radius: 10px; }
        li { padding: 12px 14px; border-bottom: 1px solid #f1f3f4; font-size: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .serial-text { font-family: monospace; font-size: 16px; font-weight: 600; color: #202124; flex: 1; }
        .used .serial-text { text-decoration: line-through; color: #9aa0a6; }
        .action-btns { display: flex; gap: 6px; }
        .check-btn { background-color: #f1f3f4; color: #5f6368; border: 1px solid #dadce0; padding: 6px 10px; font-size: 13px; border-radius: 6px; cursor: pointer; }
        .used .check-btn { background-color: #e6f4ea; color: #137333; border-color: #ceead6; }
        .delete-btn { background: none; color: #ea4335; border: none; padding: 6px 8px; font-size: 13px; cursor: pointer; }
        .msg { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; text-align: center; }
        .success { background-color: #e6f4ea; color: #137333; display: block; }
        .error { background-color: #fce8e6; color: #c5221f; display: block; }

        /* ── 카메라 스캔 영역 ── */
        #scannerSection {
            display: none;
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        #scannerSection.show { display: block; }
        #video {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }
        #scanOverlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-frame {
            width: 65%; aspect-ratio: 1.8;
            position: relative; border-radius: 8px;
        }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #ff6d00 40%, #ff6d00 60%, transparent);
            animation: scanmove 1.8s ease-in-out infinite;
        }
        @keyframes scanmove {
            0%   { top: 6%;  opacity: 0.5; }
            50%  { top: 88%; opacity: 1;   }
            100% { top: 6%;  opacity: 0.5; }
        }
        .corner { position: absolute; width: 20px; height: 20px; }
        .tl { top:-2px; left:-2px;  border-top:3px solid #ff6d00; border-left:3px solid #ff6d00;  border-radius:4px 0 0 0; }
        .tr { top:-2px; right:-2px; border-top:3px solid #ff6d00; border-right:3px solid #ff6d00; border-radius:0 4px 0 0; }
        .bl { bottom:-2px; left:-2px;  border-bottom:3px solid #ff6d00; border-left:3px solid #ff6d00;  border-radius:0 0 0 4px; }
        .br { bottom:-2px; right:-2px; border-bottom:3px solid #ff6d00; border-right:3px solid #ff6d00; border-radius:0 0 4px 0; }
        #scanStatus {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            color: #fff; font-size: 13px;
            text-align: center; padding: 8px;
        }
        #scanStatus.ok { color: #69f0ae; }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 프린터 시리얼 관리</h2>
    <div class="info-box" id="totalCount">등록된 프린터: 0대</div>

    <!-- 카메라 스캔 버튼 -->
    <button class="btn btn-scan" id="scanBtn">
        <span id="scanBtnIcon">📷</span>
        <span id="scanBtnText">카메라로 바코드 스캔</span>
    </button>

    <!-- 카메라 영역 -->
    <div id="scannerSection">
        <video id="video" autoplay muted playsinline></video>
        <div id="scanOverlay">
            <div class="scan-frame">
                <div class="scan-line"></div>
                <div class="corner tl"></div><div class="corner tr"></div>
                <div class="corner bl"></div><div class="corner br"></div>
            </div>
        </div>
        <div id="scanStatus">바코드를 프레임 안에 맞춰 주세요</div>
    </div>

    <!-- 수동 입력 -->
    <div class="input-group">
        <input type="text" id="serialInput" placeholder="시리얼 번호 직접 입력">
        <button class="btn btn-primary" id="regBtn">등록</button>
    </div>

    <!-- 대량 업로드 -->
    <div class="bulk-section">
        <div class="bulk-title">
            <span>📋 엑셀 목록 대량 업로드</span>
            <span style="font-weight:normal; font-size:12px; color:#9aa0a6;">엔터나 콤마(,)로 구분</span>
        </div>
        <textarea id="bulkInput" placeholder="엑셀에서 복사한 시리얼 번호들을 여기에 붙여넣으세요."></textarea>
        <button class="btn btn-outline" id="bulkRegBtn" style="font-size: 14px; font-weight: bold;">한 번에 모두 등록하기</button>
    </div>

    <div id="messageBox" class="msg"></div>

    <div class="list-header">
        <h3>📋 등록된 시리얼 목록</h3>
    </div>
    <ul id="serialList"></ul>

    <button class="btn btn-success" id="backupBtn">📊 엑셀(CSV) 파일로 백업받기</button>
</div>

<!-- ZXing 바코드 라이브러리 (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<script>
    /* ── 데이터 ── */
    let serialList = [];
    try {
        let storageData = localStorage.getItem("printer_serials_v2");
        if (storageData) serialList = JSON.parse(storageData);
    } catch (e) {}

    /* ── 스캐너 상태 ── */
    let scanning = false;
    let codeReader = null;
    let lastScanned = '', lastScannedTime = 0;

    /* ── 스캔 시작/중단 ── */
    document.getElementById('scanBtn').addEventListener('click', () => {
        scanning ? stopScan() : startScan();
    });

    async function startScan() {
        const ZXing = window.ZXingBrowser || window.ZXing;
        if (!ZXing) {
            showMsg('❌ 바코드 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', 'error');
            return;
        }
        try {
            // 먼저 카메라 스트림을 직접 요청 (후면 카메라 우선)
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });

            const video = document.getElementById('video');
            video.srcObject = stream;
            await video.play();

            // ZXing으로 비디오 스트림 디코딩
            codeReader = new ZXing.BrowserMultiFormatReader();
            codeReader.decodeFromStream(stream, video, (result, err) => {
                if (!result) return;
                const now = Date.now();
                const val = result.getText().trim().toUpperCase();
                if (val === lastScanned && now - lastScannedTime < 2500) return;
                lastScanned = val;
                lastScannedTime = now;

                document.getElementById('serialInput').value = val;
                setScanStatus('✅ 스캔 완료: ' + val, true);
                if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
                checkAndSave(true);

                setTimeout(() => {
                    if (scanning) setScanStatus('바코드를 프레임 안에 맞춰 주세요', false);
                }, 2000);
            });

            document.getElementById('scannerSection').classList.add('show');
            scanning = true;
            document.getElementById('scanBtn').classList.add('active');
            document.getElementById('scanBtnIcon').textContent = '⏹';
            document.getElementById('scanBtnText').textContent = '스캔 중단';

        } catch (e) {
            const msg = e.name === 'NotAllowedError'
                ? '❌ 카메라 권한이 거부됐습니다. 브라우저 설정에서 허용해 주세요.'
                : '❌ 카메라를 시작할 수 없습니다: ' + (e.message || e);
            showMsg(msg, 'error');
        }
    }

    function stopScan() {
        try { codeReader?.reset(); } catch(e) {}
        codeReader = null;
        const vid = document.getElementById('video');
        if (vid.srcObject) { vid.srcObject.getTracks().forEach(t => t.stop()); vid.srcObject = null; }
        scanning = false;
        document.getElementById('scannerSection').classList.remove('show');
        document.getElementById('scanBtn').classList.remove('active');
        document.getElementById('scanBtnIcon').textContent = '📷';
        document.getElementById('scanBtnText').textContent = '카메라로 바코드 스캔';
        setScanStatus('바코드를 프레임 안에 맞춰 주세요', false);
    }

    function setScanStatus(msg, ok) {
        const el = document.getElementById('scanStatus');
        el.textContent = msg;
        el.className = ok ? 'ok' : '';
    }

    /* ── 기존 기능 (원본 유지) ── */
    function updateUI() {
        const listElement = document.getElementById("serialList");
        const countElement = document.getElementById("totalCount");
        listElement.innerHTML = "";
        const usedCount = serialList.filter(item => item.used).length;
        countElement.innerText = `등록된 프린터: ${serialList.length}대 (사용 완료: ${usedCount}대)`;
        if (serialList.length === 0) {
            listElement.innerHTML = `<li style="justify-content: center; color: #9aa0a6; font-size: 14px;">등록된 데이터가 없습니다.</li>`;
            return;
        }
        [...serialList].reverse().forEach((item) => {
            const actualIndex = serialList.indexOf(item);
            const li = document.createElement("li");
            if (item.used) li.className = "used";
            li.innerHTML = `
                <span class="serial-text">${item.serial}</span>
                <div class="action-btns">
                    <button class="check-btn" onclick="toggleUsed(${actualIndex})">${item.used ? '✓ 완료' : '사용하기'}</button>
                    <button class="delete-btn" onclick="deleteSerial(${actualIndex})">지우기</button>
                </div>`;
            listElement.appendChild(li);
        });
    }

    function checkAndSave(auto = false) {
        const input = document.getElementById("serialInput");
        const newSerial = input.value.trim().toUpperCase();
        if (!newSerial) {
            if (!auto) showMsg("⚠️ 시리얼 번호를 입력해 주세요.", "error");
            return;
        }
        if (serialList.some(item => item.serial === newSerial)) {
            showMsg(`❌ [중복] 이미 등록된 번호입니다! (${newSerial})`, "error");
        } else {
            serialList.push({ serial: newSerial, used: false });
            saveToStorage();
            showMsg(`✅ [완료] '${newSerial}' 등록되었습니다.`, "success");
            input.value = "";
            updateUI();
        }
    }

    function bulkSave() {
        const bulkInput = document.getElementById("bulkInput");
        const text = bulkInput.value;
        if (!text.trim()) { showMsg("⚠️ 붙여넣은 내용이 없습니다.", "error"); return; }
        const lines = text.split(/[\n,;\t]+/);
        let addedCount = 0, dupCount = 0;
        lines.forEach(line => {
            const serial = line.trim().toUpperCase();
            if (serial) {
                if (!serialList.some(item => item.serial === serial)) {
                    serialList.push({ serial, used: false });
                    addedCount++;
                } else { dupCount++; }
            }
        });
        saveToStorage(); updateUI(); bulkInput.value = "";
        showMsg(`📊 대량 등록 결과 - 신규: ${addedCount}건 / 중복 제외: ${dupCount}건`, "success");
    }

    function saveToStorage() {
        try { localStorage.setItem("printer_serials_v2", JSON.stringify(serialList)); }
        catch (e) { alert("저장 한도를 초과했거나 보안에 의해 차단되었습니다."); }
    }

    function toggleUsed(index) {
        serialList[index].used = !serialList[index].used;
        saveToStorage(); updateUI();
    }

    function deleteSerial(index) {
        if (confirm("선택한 시리얼 번호를 삭제하시겠습니까?")) {
            serialList.splice(index, 1);
            saveToStorage(); updateUI();
        }
    }

    function showMsg(text, type) {
        const msgBox = document.getElementById("messageBox");
        msgBox.innerText = text;
        msgBox.className = `msg ${type}`;
        setTimeout(() => { if (msgBox.innerText === text) msgBox.style.display = 'none'; }, 4000);
    }

    function downloadCSV() {
        if (serialList.length === 0) { alert("백업할 데이터가 없습니다."); return; }
        let csvContent = "\uFEFF순번,프린터 시리얼 번호,사용 여부\n";
        serialList.forEach((item, index) => {
            csvContent += `${index + 1},${item.serial},${item.used ? "사용 완료" : "미사용"}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "printer_backup.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    document.getElementById("regBtn").addEventListener("click", () => checkAndSave(false));
    document.getElementById("bulkRegBtn").addEventListener("click", bulkSave);
    document.getElementById("backupBtn").addEventListener("click", downloadCSV);
    document.getElementById("serialInput").addEventListener("keypress", function(e) { if (e.key === "Enter") checkAndSave(false); });

    updateUI();
</script>
</body>
</html>
