<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프린터 시리얼 관리</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f4f6f9; margin:0; padding:16px; color:#333; }
        *, *::before, *::after { box-sizing:border-box; }

        /* 로그인 */
        #loginScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:-16px; background:linear-gradient(135deg,#1a73e8,#0d47a1); }
        .login-box { background:#fff; border-radius:20px; padding:36px 28px; width:320px; box-shadow:0 8px 32px rgba(0,0,0,0.18); }
        .login-logo { text-align:center; font-size:40px; margin-bottom:8px; }
        .login-title { text-align:center; font-size:18px; font-weight:700; color:#1a73e8; margin-bottom:4px; }
        .login-sub { text-align:center; font-size:13px; color:#9aa0a6; margin-bottom:28px; }
        .login-label { font-size:13px; font-weight:600; color:#5f6368; margin-bottom:6px; display:block; }
        .login-input { width:100%; padding:13px 14px; border:1.5px solid #dadce0; border-radius:10px; font-size:16px; outline:none; margin-bottom:14px; }
        .login-input:focus { border-color:#1a73e8; }
        .login-btn { width:100%; padding:14px; background:#1a73e8; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
        .login-err { color:#c5221f; font-size:13px; text-align:center; margin-top:10px; display:none; }

        /* 앱 */
        #appScreen { display:none; }
        .container { max-width:540px; margin:0 auto; background:#fff; padding:24px; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.06); }
        .top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        h2 { margin:0; color:#1a73e8; font-size:20px; }
        .logout-btn { background:none; border:1px solid #dadce0; border-radius:8px; padding:6px 12px; font-size:13px; color:#5f6368; cursor:pointer; }
        .info-box { background:#e8f0fe; padding:12px; border-radius:10px; font-size:15px; text-align:center; margin-bottom:20px; font-weight:600; color:#1967d2; }
        .btn { padding:14px 20px; color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
        .btn-primary { background:#1a73e8; }
        .btn-scan { background:#ff6d00; width:100%; margin-bottom:16px; padding:15px; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-scan.active { background:#c62828; }
        .btn-success { background:#34a853; width:100%; margin-top:8px; padding:12px; }
        .btn-outline { background:#fff; color:#5f6368; border:1px solid #dadce0; padding:10px; width:100%; margin-top:6px; }
        .input-group { display:flex; gap:8px; margin-bottom:10px; }
        input[type="text"], textarea { flex:1; padding:14px; border:1px solid #dadce0; border-radius:10px; font-size:16px; outline:none; }
        textarea { width:100%; height:100px; resize:none; font-family:monospace; font-size:14px; }
        .bulk-section { background:#f8f9fa; border:1px dashed #dadce0; padding:14px; border-radius:10px; margin-bottom:20px; }
        .bulk-title { font-size:14px; font-weight:bold; color:#5f6368; margin-bottom:8px; }
        .list-header { margin-top:24px; border-bottom:2px solid #f1f3f4; padding-bottom:8px; }
        h3 { margin:0; font-size:16px; color:#5f6368; }
        ul { list-style:none; padding:0; margin:8px 0 0 0; max-height:400px; overflow-y:auto; border:1px solid #f1f3f4; border-radius:10px; }
        li { padding:6px 10px; border-bottom:1px solid #f1f3f4; font-size:13px; display:flex; justify-content:space-between; align-items:center; background:#fff; }
        .serial-text { font-family:monospace; font-size:13px; font-weight:600; color:#202124; flex:1; }
        .used .serial-text { text-decoration:line-through; color:#9aa0a6; }
        .action-btns { display:flex; gap:6px; }
        .check-btn { background:#f1f3f4; color:#5f6368; border:1px solid #dadce0; padding:3px 7px; font-size:11px; border-radius:6px; cursor:pointer; }
        .used .check-btn { background:#e6f4ea; color:#137333; border-color:#ceead6; padding:3px 7px; font-size:11px; }
        .delete-btn { background:none; color:#ea4335; border:none; padding:3px 6px; font-size:11px; cursor:pointer; }
        .msg { padding:12px; border-radius:8px; font-size:14px; margin-bottom:16px; display:none; text-align:center; }
        .success { background:#e6f4ea; color:#137333; display:block; }
        .error { background:#fce8e6; color:#c5221f; display:block; }

        /* 카메라 */
        #scannerWrap { display:none; margin-bottom:16px; position:relative; background:#000; border-radius:12px; overflow:hidden; }
        #scannerWrap.show { display:block; }
        #video { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
        .scan-frame-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
        .scan-frame { width:80%; aspect-ratio:3/1; position:relative; }
        .scan-line { position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#ff6d00 40%,#ff6d00 60%,transparent); animation:scanmove 1.8s ease-in-out infinite; }
        @keyframes scanmove { 0%{top:6%;opacity:.5} 50%{top:88%;opacity:1} 100%{top:6%;opacity:.5} }
        .c { position:absolute; width:20px; height:20px; }
        .tl{top:-2px;left:-2px;border-top:3px solid #ff6d00;border-left:3px solid #ff6d00;border-radius:4px 0 0 0}
        .tr{top:-2px;right:-2px;border-top:3px solid #ff6d00;border-right:3px solid #ff6d00;border-radius:0 4px 0 0}
        .bl{bottom:-2px;left:-2px;border-bottom:3px solid #ff6d00;border-left:3px solid #ff6d00;border-radius:0 0 0 4px}
        .br{bottom:-2px;right:-2px;border-bottom:3px solid #ff6d00;border-right:3px solid #ff6d00;border-radius:0 0 4px 0}
        #scanStatus { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); color:#fff; font-size:13px; text-align:center; padding:8px; }
        #scanStatus.ok { color:#69f0ae; }

        /* 인쇄 */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position:fixed; inset:0; background:#fff; padding:20px; }
        }

        /* 팝업 */
        #detailPopup { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center; }
        #detailPopup.show { display:flex; }
        .popup-box { background:#fff; border-radius:16px; padding:24px; width:300px; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
        .popup-title { font-size:16px; font-weight:700; color:#1a73e8; margin-bottom:16px; text-align:center; }
        .popup-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f1f3f4; font-size:13px; }
        .popup-row:last-of-type { border-bottom:none; }
        .popup-label { color:#9aa0a6; font-weight:500; }
        .popup-value { color:#202124; font-weight:600; text-align:right; }
        .popup-close { width:100%; margin-top:16px; padding:10px; background:#1a73e8; color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
    </style>
</head>
<body>

<!-- 상세 팝업 -->
<div id="detailPopup">
    <div class="popup-box">
        <div class="popup-title">📋 시리얼 상세 정보</div>
        <div class="popup-row"><span class="popup-label">시리얼 번호</span><span class="popup-value" id="popSerial">-</span></div>
        <div class="popup-row"><span class="popup-label">등록 일시</span><span class="popup-value" id="popRegDate">-</span></div>
        <div class="popup-row"><span class="popup-label">사용 상태</span><span class="popup-value" id="popStatus">-</span></div>
        <div class="popup-row"><span class="popup-label">사용 일시</span><span class="popup-value" id="popUsedDate">-</span></div>
        <button class="popup-close" onclick="closePopup()">닫기</button>
    </div>
</div>

<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo">📱</div>
        <div class="login-title">프린터 시리얼 관리</div>
        <div class="login-sub">로그인 후 이용하실 수 있습니다</div>
        <label class="login-label">아이디</label>
        <input class="login-input" type="text" id="loginId" placeholder="아이디 입력">
        <label class="login-label">비밀번호</label>
        <input class="login-input" type="password" id="loginPw" placeholder="비밀번호 입력">
        <button class="login-btn" id="loginBtn">로그인</button>
        <div class="login-err" id="loginErr">❌ 아이디 또는 비밀번호가 틀렸습니다.</div>
    </div>
</div>

<div id="appScreen">
<div class="container">
    <div class="top-bar">
        <h2>📱 프린터 시리얼 관리</h2>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
    <div class="info-box" id="totalCount">등록된 프린터: 0대</div>

    <button class="btn btn-scan" id="scanBtn">
        <span id="scanIcon">📷</span>
        <span id="scanText">카메라로 바코드 스캔</span>
    </button>

    <div id="scannerWrap">
        <video id="video" autoplay muted playsinline></video>
        <div class="scan-frame-wrap">
            <div class="scan-frame">
                <div class="scan-line"></div>
                <div class="c tl"></div><div class="c tr"></div>
                <div class="c bl"></div><div class="c br"></div>
            </div>
        </div>
        <div id="scanStatus">바코드를 프레임 안에 맞춰 주세요</div>
    </div>

    <div class="input-group">
        <input type="text" id="serialInput" placeholder="시리얼 번호 직접 입력" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
        <button class="btn btn-primary" id="regBtn">등록</button>
    </div>

    <div class="bulk-section">
        <div class="bulk-title">📋 엑셀 목록 대량 업로드 <span style="font-weight:normal;font-size:12px;color:#9aa0a6;">(엔터/콤마로 구분)</span></div>
        <textarea id="bulkInput" placeholder="엑셀에서 복사한 시리얼 번호들을 여기에 붙여넣으세요."></textarea>
        <button class="btn btn-outline" id="bulkRegBtn" style="font-size:14px;font-weight:bold;">한 번에 모두 등록하기</button>
    </div>

    <div id="messageBox" class="msg"></div>
    <div class="list-header" style="display:flex;align-items:center;justify-content:space-between;">
        <h3>📋 등록된 시리얼 목록</h3>
        <div style="display:flex;gap:6px;">
            <button onclick="sortList('asc')" style="font-size:12px;padding:4px 8px;border:1px solid #dadce0;border-radius:6px;background:#fff;cursor:pointer;">A→Z</button>
            <button onclick="sortList('desc')" style="font-size:12px;padding:4px 8px;border:1px solid #dadce0;border-radius:6px;background:#fff;cursor:pointer;">Z→A</button>
            <button onclick="sortList('newest')" style="font-size:12px;padding:4px 8px;border:1px solid #dadce0;border-radius:6px;background:#fff;cursor:pointer;">최신순</button>
        </div>
    </div>
    <ul id="serialList"></ul>
    <button class="btn btn-success" id="backupBtn">📊 엑셀(CSV) 파일로 백업받기</button>
    <button class="btn" style="background:#5f6368;width:100%;margin-top:8px;padding:12px;" onclick="printList()">🖨️ 목록 인쇄하기</button>

    <!-- 인쇄 영역 -->
    <div id="printArea" style="display:none;">
        <div style="text-align:center;margin-bottom:16px;">
            <h2 style="color:#1a73e8;margin:0;">프린터 시리얼 관리 목록</h2>
            <p style="color:#666;font-size:13px;margin:4px 0 0;">인쇄일시: <span id="printDate"></span></p>
        </div>
        <table id="printTable" style="width:100%;border-collapse:collapse;font-size:12px;">
            <thead>
                <tr style="background:#1a73e8;color:#fff;">
                    <th style="padding:8px;border:1px solid #ddd;text-align:center;">번호</th>
                    <th style="padding:8px;border:1px solid #ddd;">시리얼 번호</th>
                    <th style="padding:8px;border:1px solid #ddd;text-align:center;">상태</th>
                    <th style="padding:8px;border:1px solid #ddd;">등록 일시</th>
                    <th style="padding:8px;border:1px solid #ddd;">사용 일시</th>
                </tr>
            </thead>
            <tbody id="printBody"></tbody>
        </table>
        <p style="font-size:11px;color:#999;margin-top:12px;text-align:right;">총 <span id="printTotal"></span>대</p>
    </div>
</div>
</div>


<script>
    /* ── 로그인 ── */
    const USERS = {'seeeye':'5864'};
    function checkSession(){ if(sessionStorage.getItem('login')==='ok') showApp(); }
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('loginPw').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });
    document.getElementById('loginId').addEventListener('keypress', e=>{ if(e.key==='Enter') document.getElementById('loginPw').focus(); });
    function doLogin(){
        const id=document.getElementById('loginId').value.trim();
        const pw=document.getElementById('loginPw').value;
        if(USERS[id]&&USERS[id]===pw){ sessionStorage.setItem('login','ok'); showApp(); }
        else{ const e=document.getElementById('loginErr'); e.style.display='block'; document.getElementById('loginPw').value=''; setTimeout(()=>e.style.display='none',3000); }
    }
    function showApp(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('appScreen').style.display='block'; updateUI(); }
    function logout(){ if(confirm('로그아웃 하시겠습니까?')){ stopScan(); sessionStorage.removeItem('login'); document.getElementById('loginScreen').style.display='flex'; document.getElementById('appScreen').style.display='none'; document.getElementById('loginId').value=''; document.getElementById('loginPw').value=''; } }

    /* ── 스캔 (Web Barcode Detection API + 3회 연속 검증) ── */
    let scanning = false, activeStream = null;
    let barcodeDetector = null;
    let lastScannedText = '', matchCount = 0;

    document.getElementById('scanBtn').addEventListener('click', ()=> scanning ? stopScan() : startScan());

    async function startScan(){
        setScanStatus('카메라 시작 중...', false);

        if(!('BarcodeDetector' in window)){
            showMsg('❌ 이 브라우저는 바코드 감지를 지원하지 않습니다. 크롬 최신버전을 사용해 주세요.','error');
            return;
        }

        try {
            const supported = await BarcodeDetector.getSupportedFormats();
            barcodeDetector = new BarcodeDetector({ formats: supported });

            activeStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080} }
            });

            const video = document.getElementById('video');
            video.srcObject = activeStream;
            await video.play();

            document.getElementById('scannerWrap').classList.add('show');
            scanning = true;
            document.getElementById('scanBtn').classList.add('active');
            document.getElementById('scanIcon').textContent = '⏹';
            document.getElementById('scanText').textContent = '스캔 중단';
            setScanStatus('바코드를 프레임 안에 맞춰 주세요', false);

            lastScannedText = ''; matchCount = 0;
            requestAnimationFrame(scanFrame);

        } catch(e){
            const msg = e.name==='NotAllowedError' ? '❌ 카메라 권한이 거부됐습니다.' : '❌ 카메라 오류: '+(e.message||e);
            showMsg(msg,'error'); setScanStatus('오류 발생',false);
        }
    }

    async function scanFrame(){
        if(!scanning) return;
        const video = document.getElementById('video');
        if(video.readyState === video.HAVE_CURRENT_DATA || video.readyState === video.HAVE_ENOUGH_DATA){
            try {
                const barcodes = await barcodeDetector.detect(video);
                if(barcodes.length > 0){
                    const currentText = barcodes[0].rawValue.trim();
                    if(currentText === lastScannedText){
                        matchCount++;
                    } else {
                        lastScannedText = currentText;
                        matchCount = 1;
                    }
                    // 3회 연속 일치시 확정
                    if(matchCount >= 3){
                        const val = currentText.toUpperCase().replace(/^\*|\*$/g,'');
                        matchCount = 0; lastScannedText = '';
                        document.getElementById('serialInput').value = val;
                        setScanStatus('✅ 인식 성공: '+val, true);
                        if(navigator.vibrate) navigator.vibrate([60,30,60]);
                        checkAndSave(true);
                        setTimeout(()=>{ if(scanning) setScanStatus('바코드를 프레임 안에 맞춰 주세요',false); },2000);
                        requestAnimationFrame(scanFrame);
                        return;
                    }
                } else {
                    matchCount = 0;
                }
            } catch(e){ console.error('스캔 중 에러:', e); }
        }
        requestAnimationFrame(scanFrame);
    }

    function stopScan(){
        scanning = false;
        lastScannedText = ''; matchCount = 0;
        try{ if(activeStream) activeStream.getTracks().forEach(t=>t.stop()); } catch(e){}
        activeStream = null;
        const v=document.getElementById('video'); v.srcObject=null;
        document.getElementById('scannerWrap').classList.remove('show');
        document.getElementById('scanBtn').classList.remove('active');
        document.getElementById('scanIcon').textContent='📷';
        document.getElementById('scanText').textContent='카메라로 바코드 스캔';
        setScanStatus('바코드를 프레임 안에 맞춰 주세요',false);
    }

    function setScanStatus(msg,ok){ const el=document.getElementById('scanStatus'); el.textContent=msg; el.className=ok?'ok':''; }

    /* ── 데이터 ── */
    let serialList=[];
    try{ const d=localStorage.getItem('printer_serials_v2'); if(d) serialList=JSON.parse(d); }catch(e){}

    function updateUI(){
        const el=document.getElementById('serialList');
        const used=serialList.filter(i=>i.used).length;
        document.getElementById('totalCount').innerText=`등록된 프린터: ${serialList.length}대 (사용 완료: ${used}대)`;
        el.innerHTML='';
        if(!serialList.length){ el.innerHTML='<li style="justify-content:center;color:#9aa0a6;font-size:14px;">등록된 데이터가 없습니다.</li>'; return; }
        let sorted = [...serialList];
        if(sortMode==='asc') sorted.sort((a,b)=>a.serial.localeCompare(b.serial));
        else if(sortMode==='desc') sorted.sort((a,b)=>b.serial.localeCompare(a.serial));
        else sorted.reverse(); // newest
        sorted.forEach(item=>{
            const idx=serialList.indexOf(item);
            const li=document.createElement('li');
            if(item.used) li.className='used';
            li.innerHTML=`
                <span class="serial-text">${item.serial}</span>
                <div class="action-btns">
                    <button class="check-btn" onclick="showDetail(${idx})">자세히</button>
                    <button class="check-btn" onclick="toggleUsed(${idx})">${item.used?'✓ 완료':'사용하기'}</button>
                    <button class="delete-btn" onclick="deleteSerial(${idx})">지우기</button>
                </div>`;
            el.appendChild(li);
        });
    }

    function checkAndSave(auto=false){
        const input=document.getElementById('serialInput');
        const val=input.value.trim().toUpperCase();
        if(!val){ if(!auto) showMsg('⚠️ 시리얼 번호를 입력해 주세요.','error'); return; }
        if(serialList.some(i=>i.serial===val)){
            showMsg(`❌ [중복] 이미 등록된 번호입니다! (${val})`,'error');
            if(navigator.vibrate) navigator.vibrate([200,100,200]);
            document.getElementById('serialInput').value='';
        }
        else{ serialList.push({serial:val,used:false,regDate:new Date().toLocaleString('ko-KR'),usedDate:''}); save(); showMsg(`✅ [완료] '${val}' 등록되었습니다.`,'success'); input.value=''; updateUI(); }
    }

    function bulkSave(){
        const text=document.getElementById('bulkInput').value;
        if(!text.trim()){ showMsg('⚠️ 붙여넣은 내용이 없습니다.','error'); return; }
        let added=0,dup=0;
        text.split(/[\n,;\t]+/).forEach(line=>{ const s=line.trim().toUpperCase(); if(s){ if(!serialList.some(i=>i.serial===s)){ serialList.push({serial:s,used:false}); added++; } else dup++; } });
        save(); updateUI(); document.getElementById('bulkInput').value='';
        showMsg(`📊 신규: ${added}건 / 중복 제외: ${dup}건`,'success');
    }

    let sortMode = 'newest';
    function sortList(mode){
        sortMode = mode;
        updateUI();
    }
    function printList(){
        const tbody = document.getElementById('printBody');
        document.getElementById('printDate').textContent = new Date().toLocaleString('ko-KR');
        document.getElementById('printTotal').textContent = serialList.length;
        tbody.innerHTML = '';
        let sorted = [...serialList];
        if(sortMode==='asc') sorted.sort((a,b)=>a.serial.localeCompare(b.serial));
        else if(sortMode==='desc') sorted.sort((a,b)=>b.serial.localeCompare(a.serial));
        else sorted.reverse();
        sorted.forEach((item,i)=>{
            const tr = document.createElement('tr');
            tr.style.background = i%2===0 ? '#fff' : '#f8f9fa';
            tr.innerHTML = `
                <td style="padding:6px 8px;border:1px solid #ddd;text-align:center;">${i+1}</td>
                <td style="padding:6px 8px;border:1px solid #ddd;font-family:monospace;font-weight:600;">${item.serial}</td>
                <td style="padding:6px 8px;border:1px solid #ddd;text-align:center;">${item.used?'✅ 사용완료':'⬜ 미사용'}</td>
                <td style="padding:6px 8px;border:1px solid #ddd;">${item.regDate||'-'}</td>
                <td style="padding:6px 8px;border:1px solid #ddd;">${item.usedDate||'-'}</td>`;
            tbody.appendChild(tr);
        });
        document.getElementById('printArea').style.display = 'block';
        setTimeout(()=>{
            window.print();
            document.getElementById('printArea').style.display = 'none';
        }, 300);
    }

    function showDetail(i){
        const item = serialList[i];
        document.getElementById('popSerial').textContent = item.serial;
        document.getElementById('popRegDate').textContent = item.regDate || '-';
        document.getElementById('popStatus').textContent = item.used ? '✅ 사용 완료' : '⬜ 미사용';
        document.getElementById('popUsedDate').textContent = item.usedDate || '-';
        document.getElementById('detailPopup').classList.add('show');
    }
    function closePopup(){
        document.getElementById('detailPopup').classList.remove('show');
    }
    // 팝업 바깥 클릭시 닫기
    document.getElementById('detailPopup').addEventListener('click', function(e){ if(e.target===this) closePopup(); });

    function save(){ try{ localStorage.setItem('printer_serials_v2',JSON.stringify(serialList)); }catch(e){} }
    function toggleUsed(i){
        serialList[i].used=!serialList[i].used;
        serialList[i].usedDate = serialList[i].used ? new Date().toLocaleString('ko-KR') : '';
        save(); updateUI();
    }
    function deleteSerial(i){ if(confirm('삭제하시겠습니까?')){ serialList.splice(i,1); save(); updateUI(); } }

    function showMsg(text,type){
        const el=document.getElementById('messageBox');
        el.innerText=text; el.className=`msg ${type}`;
        setTimeout(()=>{ if(el.innerText===text) el.style.display='none'; },4000);
    }

    function downloadCSV(){
        if(!serialList.length){ alert('백업할 데이터가 없습니다.'); return; }
        let csv='\uFEFF순번,프린터 시리얼 번호,사용 여부,등록일,사용일\n';
        serialList.forEach((item,i)=>{ csv+=`${i+1},${item.serial},${item.used?'사용 완료':'미사용'},${item.regDate||''},${item.usedDate||''}\n`; });
        const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
        a.download='printer_backup.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    document.getElementById('regBtn').addEventListener('click',()=>checkAndSave(false));
    document.getElementById('bulkRegBtn').addEventListener('click',bulkSave);
    document.getElementById('backupBtn').addEventListener('click',downloadCSV);
    document.getElementById('serialInput').addEventListener('keypress',e=>{ if(e.key==='Enter') checkAndSave(false); });

    checkSession();
</script>
</body>
</html>
